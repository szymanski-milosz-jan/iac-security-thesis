name: CI - Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write        # wymagane przez federację OIDC
  contents: read
  security-events: write # wymagane do publikacji SARIF
  pull-requests: write    # wymagane do komentowania PR planem

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Uwierzytelnienie w AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terraform init
        run: terraform init -input=false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform validate
        run: terraform validate

      - name: Checkov - analiza kodu źródłowego
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-source.sarif
          soft_fail: true   # bramka blokująca realizowana w oddzielnym kroku (patrz niżej)

      - name: Publikacja wyników (kod źródłowy)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-source.sarif
          category: checkov-source

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan.binary

      - name: Eksport planu do JSON
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Checkov - analiza terraform plan
        uses: bridgecrewio/checkov-action@master
        with:
          file: tfplan.json
          framework: terraform_plan
          output_format: cli,sarif
          output_file_path: console,checkov-plan.sarif
          soft_fail: true

      - name: Publikacja wyników (plan Terraform)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-plan.sarif
          category: checkov-plan

      - name: Bramka blokująca (HIGH / CRITICAL)
        run: |
          checkov -f tfplan.json --framework terraform_plan --soft-fail \
            --hard-fail-on CKV_AWS_20,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56,CKV_AWS_21,CKV_AWS_145,CKV_AWS_24,CKV_AWS_25,CKV_AWS_382,CKV_AWS_62,CKV_AWS_63,CKV_AWS_17,CKV_AWS_16,CKV_AWS_293,CKV_AWS_157,HIGH,CRITICAL \
            --soft-fail-on LOW,MEDIUM --compact

      - name: Komentarz z planem w pull requeście
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            // odczyt tfplan.json i publikacja skróconego podsumowania
            // jako komentarza do pull requesta (github.rest.issues.createComment)
